[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Pinned by version, never by path: every build machine carries this compiler offline.
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# The launch compares deployed bytes without a metadata hash; a build with one is refused.
bytecode_hash = "none"
cbor_metadata = false

# No cheatcode escape hatches: the verifier refuses ffi and write access.
ffi = false
fs_permissions = []

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
